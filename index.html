<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통·리·반 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing:border-box; }
body { margin:0; font-family:"Malgun Gothic",sans-serif; color:#263746; }
#gisMap { position:absolute; inset:0; }
#panel { position:absolute; top:12px; left:12px; z-index:1000; width:300px; padding:16px; border-radius:10px; background:white; box-shadow:0 2px 10px #0003; max-height:calc(100vh - 24px); overflow:auto; }
h1 { font-size:18px; margin:0 0 12px; }
label { display:block; font-size:12px; margin-top:12px; }
select, button { width:100%; padding:10px; margin-top:5px; border:1px solid #d6dfe6; border-radius:7px; background:#f8fafc; font:inherit; font-size:13px; }
input[type=search], input[type=password] { width:100%; padding:10px; border:1px solid #d6dfe6; border-radius:7px; font:inherit; }
#addressStatus { font-size:13px; margin:10px 0; overflow-wrap:anywhere; }
#addressForm small { display:block; margin-top:8px; font-size:11px; }
button { cursor:pointer; text-align:left; }
input[type=file] { width:100%; margin:8px 0; }
a { color:#004c80; font-size:13px; }
:focus-visible { outline:2px solid #004c80; outline-offset:2px; }
#viewerStatus { font-size:12px; margin:12px 0; overflow-wrap:anywhere; }
#viewerTitle { font-size:14px; }
#printHeading { display:none; }
#batchStatus { font-size:13px; overflow-wrap:anywhere; }
#batchTools { margin-top:12px; }
#batchTools small { display:block; margin:8px 0; line-height:1.5; }
@media (max-width:600px) {
  #panel { top:auto; bottom:0; left:0; width:100%; max-height:42vh; border-radius:12px 12px 0 0; }
  #gisMap { bottom:42vh; }
  select, button { font-size:16px; min-height:42px; }
}
@page { size:A4 landscape; margin:10mm; }
@media print {
  #panel, .leaflet-control-zoom, .leaflet-popup-pane, .leaflet-marker-pane { display:none !important; }
  #printHeading { display:block; margin:0 0 5mm; font-size:12px; }
  #printHeading h1 { margin-bottom:2mm; }
  #gisMap { position:relative; inset:auto; width:100%; height:165mm; break-inside:avoid; }
  .leaflet-container { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
}
</style>
</head>
<body>
<header id="printHeading"><h1 id="printTitle"></h1><div>통·리·반 경계 · 점선: 반 · 참고용, 공식 행정구역 증명 아님</div></header>
<div id="gisMap"></div>
<main id="panel">
<h1>통·리·반 지도</h1>
<a href="editor.html">지도 편집하기</a>
<label for="sidoSelect">시도</label><select id="sidoSelect"></select>
<label for="sggSelect">시군구</label><select id="sggSelect"></select>
<label for="dongSelect">읍면동</label><select id="dongSelect"></select>
<label for="viewerFile">통·리·반 JSON</label><input type="file" id="viewerFile" accept=".json" disabled>
<div id="viewerStatus" role="status">지도 준비 중…</div>
<h2 id="viewerTitle"></h2><div id="viewerList"></div>
<form id="addressForm">
<label for="addressQuery">주소로 통·반 찾기</label>
<input id="addressQuery" type="search" maxlength="300" autocomplete="off" placeholder="시·군·구를 포함한 전체 주소">
<label for="addressType">주소 종류</label><select id="addressType"><option value="ROAD">도로명주소</option><option value="PARCEL">지번주소</option></select>
<details><summary>주소 검색 API 설정</summary>
<label for="addressKey">브이월드 인증키 · 저장하지 않음</label><input id="addressKey" type="password" autocomplete="off" spellcheck="false">
<small>검색 시 주소와 키가 브이월드로 전송됩니다. 지오코더 API 권한이 필요합니다.</small></details>
<button type="submit">주소 검색</button><button id="addressClear" type="button">검색 지우기 · 키 삭제</button>
<div id="addressStatus" role="status" aria-live="polite"></div>
</form>
<details id="batchTools"><summary>주소 CSV 일괄 조회</summary>
<label for="batchFile">주소 열만 있는 UTF-8 CSV · 최대 100건</label><input id="batchFile" type="file" accept=".csv,text/csv">
<small>첫 줄은 주소 또는 address입니다. 선택한 주소 종류와 위 인증키를 사용합니다. 시작하면 각 주소와 키가 브이월드로 전송됩니다. 결과는 참고 판정이며 자동 저장하지 않습니다.</small>
<button id="batchStart" type="button">브이월드로 주소 전송 · 조회 시작</button>
<button id="batchCancel" type="button" disabled>조회 취소</button>
<button id="batchExport" type="button" disabled>결과 CSV 저장</button>
<button id="batchClear" type="button">CSV · 결과 지우기</button>
<div id="batchStatus" role="status" aria-live="polite"></div>
</details>
<button id="printMap" type="button">현재 화면 인쇄 · PDF</button>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="map.js"></script>
<script src="data-format.js"></script>
<script src="viewer.js"></script>
<script src="local-work.js"></script>
<script src="src/vendor/turf.min.js"></script>
<script src="address-search.js"></script>
<script src="viewer-tools.js"></script>
</body>
</html>
